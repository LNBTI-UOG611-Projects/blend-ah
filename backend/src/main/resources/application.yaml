spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver 

  hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000
      max-lifetime: 600000  

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: 8080