
spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver 

  hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000
      max-lifetime: 600000  

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: 8080

  # Member 1 - authentication settings
app:
  jwt:
    # At least 32 characters. Put the real value in backend/.env (JWT_SECRET=...)
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  security:
    # false = admin & mini-app endpoints stay open (current behaviour, so the
    # admin portal keeps working). Set ENFORCE_ADMIN_ROLES=true once the admin
    # portal sends a login token.
    enforce-admin-roles: ${ENFORCE_ADMIN_ROLES:false}